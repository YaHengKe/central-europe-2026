<script>
'use strict';
const DATA=JSON.parse(document.getElementById('trip-data').textContent);
const DAYS=DATA.days, LOC=DATA.locations, PIC=DATA.photos;
const NAV=[['home','⌂','首頁'],['days','▦','日程'],['transit','⇄','交通'],['hotels','▤','住宿'],['food','♨','餐飲'],['tools','✓','票券']];
let activePage='home', activeDay=0;
let ROUTE_MAP_DATA=null, ROUTE_MAP_PROMISE=null, routeSegmentIndex=0;
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function googleMap(id){const loc=LOC[id];return loc?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc[1]):'#'}
function googleDir(a,b,mode='walking'){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(LOC[a]?.[1]||a)+'&destination='+encodeURIComponent(LOC[b]?.[1]||b)+'&travelmode='+encodeURIComponent(mode)}
function badge(status){if(!status)return '';let k=/已訂/.test(status)?'good':/待|未訂|尚未/.test(status)?'warn':'warn';return `<span class="pill ${k}">${escapeHTML(status)}</span>`}
function picture(key,label='',loading='lazy'){let p=PIC[key];if(!p)return `<div class="picture" style="background:linear-gradient(125deg,#183b40,#7e9491)"></div>`;return `<div class="picture"><img src="${escapeHTML(p.src)}" alt="${escapeHTML(p.caption)}" loading="${loading}" onerror="this.classList.add('failed')"><div class="picture-label">${escapeHTML(label||p.caption)}</div></div>`}
function photoCredit(k){let p=PIC[k];return p?`<a class="photo-credit" href="${escapeHTML(p.page)}" target="_blank" rel="noopener noreferrer" title="查看照片作者與授權">↗ 照片：${escapeHTML(p.author)} · ${escapeHTML(p.license)}</a>`:''}
function mapButton(k,text='地圖定位'){if(!k||!LOC[k])return '';return `<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${googleMap(k)}">⌖ ${text}</a>`}
function routeButton(r){if(!r||!LOC[r[0]]||!LOC[r[1]])return '';return `<a class="btn" target="_blank" rel="noopener noreferrer" href="${googleDir(...r)}">↗ 路線導航</a>`}
function todayIndex(){try{let now=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return Math.max(0,DAYS.findIndex(d=>d.date===now))}catch(_){return 0}}
function journalScene(city){if(city==='prague')return `<svg class="journal-illustration" viewBox="0 0 440 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="jpSky" x2="0" y2="1"><stop stop-color="#adbbad"/><stop offset="1" stop-color="#dbc7aa"/></linearGradient></defs><rect width="440" height="320" fill="url(#jpSky)"/><circle cx="319" cy="67" r="35" fill="#f1e6b8" opacity=".72"/><path d="M0 238 60 215 102 222 135 177 180 209 222 164 271 194 314 150 360 202 440 180V320H0Z" fill="#73847c"/><path d="M0 278 25 248 65 257 65 181 90 181 90 140 98 123 106 140 106 181 124 181 124 220 170 231 170 138 184 123 192 68 200 123 214 138 214 244 227 244 227 125 244 112 252 60 260 112 278 125 278 245 315 236 315 195 339 195 339 162 352 154 365 162 365 235 405 223 405 202 440 206V320H0Z" fill="#244b55"/><path d="M180 138 192 109 203 138M234 125 252 94 272 125" stroke="#173946" stroke-width="5" fill="none"/><rect y="278" width="440" height="42" fill="#244b55"/></svg>`;return `<svg class="journal-illustration" viewBox="0 0 440 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="jvSky" x2="0" y2="1"><stop stop-color="#b6cbbd"/><stop offset="1" stop-color="#d8d0b2"/></linearGradient></defs><rect width="440" height="320" fill="url(#jvSky)"/><rect y="238" width="440" height="82" fill="#799b8d"/><rect x="67" y="145" width="312" height="108" fill="#e7c895"/><rect x="87" y="122" width="272" height="33" fill="#ebd7aa"/><path d="M78 121 220 87 368 121Z" fill="#cfb07a"/><rect x="172" y="80" width="96" height="34" fill="#d5b981"/><rect x="209" y="52" width="22" height="40" fill="#e7d59f"/><rect x="215" y="33" width="10" height="24" fill="#ebdbae"/><rect x="205" y="146" width="30" height="107" fill="#46666d"/><g fill="#6e8c88"><rect x="105" y="169" width="23" height="42"/><rect x="142" y="169" width="23" height="42"/><rect x="272" y="169" width="23" height="42"/><rect x="308" y="169" width="23" height="42"/></g><path d="M0 257H440" stroke="#d1b88e" stroke-width="7"/><path d="M32 275Q220 248 408 275" fill="none" stroke="#e3d9b7" stroke-width="3"/></svg>`}
function hero(){return `<div class="journal-home"><div class="wrap"><div class="journal-topline"><span class="mark">Central Europe 2026</span><span class="postmark">11 DAYS · 3 COUNTRIES</span></div><section class="journal-hero"><div class="journal-intro"><span class="journal-kicker">19–29 OCTOBER 2026</span><h1>捷克・奧地利・匈牙利</h1><p>布拉格 → CK → Hallstatt → 維也納 → 布達佩斯 → 布拉格</p><div class="journal-hero-actions"><button class="journal-btn" onclick="go('days',0)">查看每日行程 ↗</button><button class="journal-btn secondary" onclick="go('transit')">交通與轉乘 ↗</button></div><div class="journal-hero-note">✦ 已訂交通、住宿及重要提醒都整理在內頁</div></div><div class="journal-collage"><div class="journal-polaroid one" role="button" tabindex="0" onclick="go('days',1)" onkeydown="if(event.key==='Enter')go('days',1)">${journalScene('prague')}<img src="${escapeHTML(PIC.tyn.src)}" alt="布拉格老城與泰恩教堂實景" loading="eager" onerror="this.style.display='none'"><div class="polcap">Prague · Old Town</div></div><div class="journal-polaroid two" role="button" tabindex="0" onclick="go('days',6)" onkeydown="if(event.key==='Enter')go('days',6)">${journalScene('vienna')}<img src="${escapeHTML(PIC.schon.src)}" alt="維也納美泉宮實景" loading="eager" onerror="this.style.display='none'"><div class="polcap">Vienna · Schönbrunn</div></div><div class="journal-photo-credit">照片來源：<a href="${escapeHTML(PIC.tyn.page)}" target="_blank" rel="noopener noreferrer">布拉格</a> · <a href="${escapeHTML(PIC.schon.page)}" target="_blank" rel="noopener noreferrer">美泉宮</a></div></div></section></div>`}
function secTitle(over,title,desc='',side=''){return `<div class="section-head"><div><div class="over">${escapeHTML(over)}</div><h2>${escapeHTML(title)}</h2>${desc?`<p>${escapeHTML(desc)}</p>`:''}</div>${side?`<div class="side">${side}</div>`:''}</div>`}
function home(){const chapters=[['布拉格','10/20–21','紅色屋頂、天文鐘與查理大橋',1],['Český Krumlov','10/22','伏爾塔瓦河環繞的童話小鎮',3],['Hallstatt','10/23','阿爾卑斯湖畔與明信片角度',4],['Dachstein','10/24','兩段纜車與五指觀景台',5],['維也納','10/25–26','美泉宮、霍夫堡與皇室文化',6],['布達佩斯','10/26–27','漁人堡與多瑙河夜間遊船',7]];return hero()+`<div class="wrap journal-body"><div class="journal-section-head"><div><span class="journal-kicker">COLLECT THE MEMORIES</span><h2>六個停留章節</h2><p>選擇城市，查看當天行程。</p></div><span class="journal-seal">TRAVEL NOTES · 2026</span></div><div class="journal-chapters">${chapters.map((c,i)=>`<button class="journal-chapter" onclick="go('days',${c[3]})"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${escapeHTML(c[0])}</h3><p>${escapeHTML(c[1])} · ${escapeHTML(c[2])}</p><small>翻閱這一章 ↗</small></button>`).join('')}</div><div class="journal-section-head"><div><span class="journal-kicker">YOUR POCKET GUIDE</span><h2>隨身翻閱的三張索引卡</h2><p>快速查看行程、交通與住宿。</p></div></div><div class="journal-shortcuts"><button class="journal-shortcut" onclick="go('days',0)"><span class="label">01 / THE DAYS</span><strong>每日行程</strong><p>11 天時間軸、各個景點實景與 Google Maps 導航。</p></button><button class="journal-shortcut" onclick="go('transit')"><span class="label">02 / THE JOURNEY</span><strong>交通與轉乘</strong><p>跨國火車、FlixBus、CK Shuttle 與登船碼頭都在這裡。</p></button><button class="journal-shortcut" onclick="go('hotels')"><span class="label">03 / OUR STAYS</span><strong>住宿口袋卡</strong><p>飯店地址、早餐、付款與下一段行李移動資訊。</p></button></div><div class="journal-section-head"><div><span class="journal-kicker">NOTES BEFORE DEPARTURE</span><h2>別忘了，這兩段很重要</h2><p>手帳頁邊的重點備註，避免在轉車或候船時手忙腳亂。</p></div></div><div class="journal-warnings"><div class="journal-warning priority"><span class="over">⚠ OCT 24 · IMPORTANT TRANSFER</span><h3>Obertraun → Wien Hbf</h3><p>14:59 出發。Bad Ischl 只有 <strong>5 分鐘</strong>換乘 SV170 替代巴士；Attnang-Puchheim 再以 <strong>9 分鐘</strong>轉乘 IC743。請先取得有效 ÖBB 車票並核對當日站位。</p><button onclick="go('transit')">查看轉乘筆記 ↗</button></div><div class="journal-warning"><span class="over">BOOKED · OCT 27</span><h3>Danube Legend · 20:40</h3><p>夜間遊船已訂 NT$1,793，登船位置 Jane Haining rakpart 第 7 號碼頭。New York Café 尚未訂位，建議 19:30 前離開。</p><button onclick="go('days',8)">翻到布達佩斯那一天 ↗</button></div></div><div class="journal-section-head"><div><span class="journal-kicker">DAY BY DAY</span><h2>十一天旅行日誌</h2><p>從飛往布拉格到最後一天搭機返台，依日期逐頁翻閱。</p></div><span class="journal-seal">19–29 OCT 2026</span></div><div class="journal-dates">${DAYS.map((d,i)=>`<button class="journal-day" onclick="go('days',${i})"><span class="date">${escapeHTML(d.short)}</span><h3>${escapeHTML(d.headline)}</h3><p>${escapeHTML(d.flag)} ${escapeHTML(d.city)} · ${d.events.length} 個行程節點</p></button>`).join('')}</div><div class="journal-footnote"><strong>旅行資訊提醒：</strong>本手冊為依照 Google 試算表製作的離線可讀行程快照。照片與 Google Maps 需網路，交通實際站位、臨時替代巴士與月台仍以當日官方公告及有效車票為準。<button class="journal-btn secondary" style="margin-left:8px;margin-top:8px" onclick="go('tools')">票券與待辦 ↗</button></div></div></div>`}

function dayMapSection(){return `<section class="daily-map-section" aria-label="當日路線地圖"><span class="over">TODAY'S ROUTE MAP</span><h2>當日景點動線地圖</h2><p class="sub">依當天行程標示停靠點，可切換不同區域。點地圖上的數字可查 Google Maps 定位；圖線是大致順序，不是實際道路、車軌或步行路徑。</p><div id="day-map-panel" class="daily-map-loading">正在準備路線地圖…</div></section>`}
function routeMapHref(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address||p.name)}
function routeLegHref(a,b,mode){let m=mode==='driving'?'driving':mode==='walking'?'walking':'transit';return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a.address||a.name)+'&destination='+encodeURIComponent(b.address||b.name)+'&travelmode='+m}
function routeModeText(mode){return ({walking:'步行',transit:'大眾運輸',train:'火車／接駁',driving:'開車',cable:'纜車'})[mode]||'路線'}
function routeSegmentContent(date,idx){let group=ROUTE_MAP_DATA?.days?.[date]?.groups?.[idx];if(!group)return '<div class="daily-map-loading">未找到此日期地圖資料</div>';
 const rows=group.stops.map((p,i)=>{const a=routeMapHref(p);const from=i>0?(p.from||group.mode||'walking'):null;const leg=i>0?routeLegHref(group.stops[i-1],p,from):'';return `<div class="daily-map-stop"><span class="order">${i+1}</span><span class="place" title="${escapeHTML(p.name)}">${escapeHTML(p.name)}</span>${i>0?`<a href="${escapeHTML(leg)}" target="_blank" rel="noopener noreferrer" title="開啟上一站到這站的 Google Maps 導航">${routeModeText(from)} ↗</a>`:''}<a href="${escapeHTML(a)}" target="_blank" rel="noopener noreferrer" title="Google Maps 景點定位">定位 ↗</a></div>`}).join('');
 const tabs=ROUTE_MAP_DATA.days[date].groups.map((g,i)=>`<button type="button" class="${i===idx?'active':''}" aria-pressed="${i===idx}" onclick="switchRouteSegment(${i})">${escapeHTML(g.label)}</button>`).join('');
 const url='route-map-frame.html?date='+encodeURIComponent(date)+'&segment='+encodeURIComponent(group.id);
 return `<div class="daily-map-tabs" role="group" aria-label="切換當日地圖區段">${tabs}</div><p class="daily-map-desc">${escapeHTML(group.description)}</p><iframe class="daily-map-frame" title="${escapeHTML(date+' '+group.label+' 路線地圖')}" src="${escapeHTML(url)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" aria-label="行程順序與景點互動地圖"></iframe>${group.notice?`<div class="daily-map-warn">${escapeHTML(group.notice)}</div>`:''}<p class="daily-map-hint">▸ 點數字查看停靠點，或使用下列 Google Maps 導航。連線是行程先後順序示意，請勿把直線當成可通行道路。若地圖因網路未載入，下方導航連結仍可使用。</p><div class="daily-map-stops">${rows}</div>`;
}
async function loadDailyRouteMaps(){if(ROUTE_MAP_DATA)return ROUTE_MAP_DATA;if(!ROUTE_MAP_PROMISE)ROUTE_MAP_PROMISE=fetch('daily-routes.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('route data '+r.status);return r.json()}).then(j=>{ROUTE_MAP_DATA=j;return j}).catch(e=>{ROUTE_MAP_PROMISE=null;throw e});return ROUTE_MAP_PROMISE}
async function renderDayRouteMap(){const panel=document.getElementById('day-map-panel');if(activePage!=='days'||!panel)return;const date=DAYS[activeDay].date;try{await loadDailyRouteMaps();if(activePage!=='days'||DAYS[activeDay].date!==date)return;const current=document.getElementById('day-map-panel');if(current){routeSegmentIndex=Math.min(Math.max(0,routeSegmentIndex),ROUTE_MAP_DATA.days?.[date]?.groups?.length-1||0);current.className='';current.innerHTML=routeSegmentContent(date,routeSegmentIndex)}}catch(e){const current=document.getElementById('day-map-panel');if(current)current.innerHTML='地圖資料暫時無法載入，請使用各行程項目原有的 Google Maps 定位按鈕。'}}
function switchRouteSegment(i){const groups=ROUTE_MAP_DATA?.days?.[DAYS[activeDay].date]?.groups;if(!groups||!Number.isInteger(i)||i<0||i>=groups.length)return;routeSegmentIndex=i;const panel=document.getElementById('day-map-panel');if(panel)panel.innerHTML=routeSegmentContent(DAYS[activeDay].date,i)}

lass="btn" onclick="go('days',${Math.min(10,activeDay+1)})" ${activeDay===10?'disabled':''}>下一天 →</button></div></div></div></div>`}
function transferStrip(){return `<div class="transfer-strip"><div class="eyebrow">HIGH PRIORITY · 24 OCT 2026</div><h3>Obertraun → Vienna：5 分鐘＋9 分鐘短轉乘</h3><div class="sub">本段已訂 ÖBB；不是普通的直達火車。班次和替代巴士安排以旅行當天即時資訊為準。</div><div class="transfer-stops"><div class="transfer-stop"><div class="stamp">14:59</div><div class="title">Obertraun-Dachsteinhöhlen</div><div class="desc">REX 70 出發</div></div><div class="transfer-stop"><div class="stamp">15:35</div><div class="title">Bad Ischl</div><div class="desc red">⚠ 5 分鐘換 SV170 巴士</div></div><div class="transfer-stop"><div class="stamp">17:01</div><div class="title">Attnang-Puchheim</div><div class="desc red">⚠ 9 分鐘換 IC743</div></div><div class="transfer-stop"><div class="stamp">19:03</div><div class="title">Wien Hauptbahnhof</div><div class="desc">抵達維也納中央車站</div></div></div><p style="margin:15px 0 0;color:#becfce;font-size:11px">出發前：下載正式 ÖBB 車票 PDF/QR → 查 REX／替代巴士運轉資訊 → 查實際月台與巴士乘車區域 → 確保已取回寄放行李。</p></div>`}
function transitPage(){return `<div class="wrap content">${secTitle('MOVING BETWEEN PLACES','交通與轉乘中心','所有提前時間是安全建議，不是營運商正式要求；列車實際月台、運休及臨時站位以當日公告與票券為準。')} ${transferStrip()}<div class="transport-grid">${DATA.transport.map(t=>`<article class="transport-card ${t.critical?'critical':''}"><div class="transport-card-top"><div class="tag">${escapeHTML(t.date)} · ${escapeHTML(t.mode)}</div>${badge(t.status)}</div><h3>${escapeHTML(t.title)}</h3><div class="time">◷ ${escapeHTML(t.when)}</div><p><strong>出發準備：</strong>${escapeHTML(t.before)}</p><p class="alert"><strong>⚠ 注意｜</strong>${escapeHTML(t.alert)}</p><div class="transport-actions">${t.from_id?mapButton(t.from_id,'起點定位'):''}${t.to_id?mapButton(t.to_id,'終點定位'):''}${t.from_id&&t.to_id?routeButton([t.from_id,t.to_id,['巴士','機場巴士','跨國火車'].includes(t.mode)?'transit':'walking']):''}${t.official?`<a class="btn secondary" href="${t.official}" target="_blank" rel="noopener noreferrer">↗ 營運商官網</a>`:''}</div></article>`).join('')}</div><div style="margin-top:20px">${notice()}</div></div>`}

function foodsPage(){return `<div class="wrap content">${secTitle('PLACES TO EAT','素食餐廳與咖啡館','以素食、全素選項優先；菜單、營業時間及訂位情況請於前一晚再次確認。')}<div class="food-grid">${DATA.restaurants.map(x=>`<article class="food-card"><div class="food-cat">${escapeHTML(x.date)} · ${escapeHTML(x.kind)}</div><h3>${escapeHTML(x.name)}</h3><p>${escapeHTML(x.note)}</p><div class="bottom">${mapButton(x.loc,'餐廳定位')}</div></article>`).join('')}</div>${secTitle('SOuVENIRS','維也納伴手禮備忘')}<div class="hotel-grid">${[['Sacher','sacher','歌劇院旁：巧克力與 Sacher-Torte。'],['Demel','demel','霍夫堡旁：皇室巧克力禮盒。'],['Manner','manner','聖斯德望旁：粉紅威化餅、Mozartkugeln。']].map(x=>`<div class="hotel-card"><h3>${x[0]}</h3><p>${x[2]}</p>${mapButton(x[1],'開啟地圖')}</div>`).join('')}</div></div>`}
// Ticket category and status tabs; separate from booking data.
const TICKET_TYPES=[['all','全部'],['flight','機票'],['transport','交通'],['sight','景點'],['dining','餐廳']];
const TICKET_STATUS=[['all','全部狀態'],['booked','已訂'],['todo','待處理']];
let ticketFilter={type:'all',status:'all'};
function ticketType(t){const n=t.name||'';if(/星宇|JX10/.test(n))return 'flight';if(/FlixBus|Shuttle|ÖBB|ČD|EC 278/.test(n))return 'transport';if(/Café|Cafe|餐廳/.test(n))return 'dining';return 'sight'}
function ticketStatus(t){return /^已訂/.test(t.status)?'booked':'todo'}
function filteredTickets(){return DATA.tickets.filter(t=>(ticketFilter.type==='all'||ticketType(t)===ticketFilter.type)&&(ticketFilter.status==='all'||ticketStatus(t)===ticketFilter.status))}
function setTicketFilter(kind,value){if(kind!=='type'&&kind!=='status')return;const allowed=(kind==='type'?TICKET_TYPES:TICKET_STATUS).some(v=>v[0]===value);if(!allowed)return;ticketFilter[kind]=value;render()}
function ticketFilterButtons(kind,groups){return `<div class="ticket-tabs" role="group" aria-label="${kind==='type'?'票券類別':'預訂狀態'}">${groups.map(([key,label])=>{const active=ticketFilter[kind]===key;const count=DATA.tickets.filter(t=>(kind==='type'?(key==='all'||ticketType(t)===key):(key==='all'||ticketStatus(t)===key))).length;return `<button class="ticket-filter ${active?'active':''}" aria-pressed="${active}" onclick="setTicketFilter('${kind}','${key}')">${label}<span class="filter-count">${count}</span></button>`}).join('')}</div>`}

// The published JSON contains the initial shared checklist definitions. Each visitor's edits
// are local-only by default: GitHub Pages cannot write to a repository without authentication.
let CHECKS=[{"id":"oebb","title":"下載 10/24、10/26 有效 ÖBB 車票 PDF/QR","detail":"訂位確認 email 不是有效乘車票。","checked":false},{"id":"flix","title":"存 FlixBus 票並確認 10/22 Opletalova 上車點","detail":"早上 09:15 發車。","checked":false},{"id":"ck","title":"確認 10/23 09:10 CK Shuttle 飯店接送","detail":"Abraka → Haus Bellevue，門到門接送。","checked":false},{"id":"kripp","title":"10/22～23 看 Dachstein 10/24 纜車、風速、Webcam","detail":"尚未購票，視天氣決定。","checked":false},{"id":"oct24","title":"確認 10/24 SV170 替代巴士及 5／9 分鐘轉乘","detail":"先查 ÖBB 當日公告。","checked":false},{"id":"schon","title":"美泉宮 10/25 08:30–08:45 門票已存檔","detail":"早上計程車約 07:45 上車。","checked":false},{"id":"belvedere","title":"決定要不要買 10/26 Upper Belvedere 門票","detail":"目前 09:00 暫排、尚未購票。","checked":false},{"id":"parliament","title":"決定要不要預約 10/27 國會大廈內部導覽","detail":"12:00 暫排，不代表有票。","checked":false},{"id":"cafe","title":"預約 New York Café 晚間座位或準備候位備案","detail":"10/27 19:30 前離開，不得耽誤遊船。","checked":false},{"id":"cruise","title":"備份 10/27 Legenda 20:40 遊船電子票","detail":"已訂 NT$1,793，Jane Haining rakpart Dock 7。","checked":false},{"id":"nyugati","title":"儲存 10/28 EC278 電子票與 Nyugati 位置","detail":"不是 10/26 抵達的 Keleti。","checked":false},{"id":"ae","title":"10/28 晚核對 10/29 AE 臨時站及首班車","detail":"可準備 Bolt／Uber 備案。","checked":false},{"id":"hotel","title":"Prague Star 入住現金 €115","detail":"Duplex Studio 雙人入住；沒有承諾 twin。","checked":false},{"id":"charger","title":"歐規 C／E／F 轉接頭、100–240V 充電器","detail":"山上另準備保暖、防風外套與手套。","checked":false}];
const CHECK_STORAGE_KEY='ce2026_check_v1';
const CHECK_SAVED_KEY='ce2026_check_saved_at';
function getSavedCheckRaw(){try{return JSON.parse(localStorage.getItem(CHECK_STORAGE_KEY)||'{}')}catch(e){return {}}}
function checkState(){const raw=getSavedCheckRaw();const out=Object.create(null);for(const c of CHECKS)out[c.id]=typeof raw[c.id]==='boolean'?raw[c.id]:!!c.checked;return out}
function saveCheckState(state){try{localStorage.setItem(CHECK_STORAGE_KEY,JSON.stringify(state));localStorage.setItem(CHECK_SAVED_KEY,new Date().toISOString());return true}catch(e){return false}}
function toggleCheck(id,checked){if(!CHECKS.some(x=>x.id===id))return;const state=checkState();state[id]=checked;const ok=saveCheckState(state);const elem=document.querySelector('[data-check="'+id+'"]');if(elem)elem.classList.toggle('done',checked);updateCheckCount();showCheckSave(ok?'已自動儲存到這台裝置':'無法儲存，請確認瀏覽器允許本機儲存',!ok)}
function showCheckSave(text,error=false){const n=document.getElementById('check-save-status');if(n){n.textContent=text;n.classList.toggle('error',error)}}
function updateCheckCount(){const n=document.getElementById('check-count');if(n)n.textContent=CHECKS.filter(x=>checkState()[x.id]).length+'/'+CHECKS.length+' 項完成'}
function exportChecklist(){const payload={schema:'central-europe-check-state-v1',exportedAt:new Date().toISOString(),checked:checkState()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='中歐旅行_核對清單_備份.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);showCheckSave('JSON 備份已下載，可在其他裝置匯入。')}
async function importChecklist(input){const file=input.files&&input.files[0];if(!file)return;try{if(file.size>500000)throw Error('檔案太大');const parsed=JSON.parse(await file.text());const raw=parsed.checked||parsed.state;if(parsed.schema!=='central-europe-check-state-v1'||!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('JSON 格式不正確');const state=checkState();let found=0;for(const item of CHECKS){if(Object.prototype.hasOwnProperty.call(raw,item.id)&&typeof raw[item.id]==='boolean'){state[item.id]=raw[item.id];found++}}if(found===0)throw Error('找不到相符的清單項目');if(!saveCheckState(state))throw Error('瀏覽器拒絕儲存');render();showCheckSave('成功匯入 '+found+' 項，已儲存在此裝置。')}catch(e){showCheckSave('匯入失敗：'+e.message,true)}finally{input.value=''}}
async function loadChecklistDefaults(){try{const resp=await fetch('./checklist.json',{cache:'no-store'});if(!resp.ok)throw Error('無法載入');const obj=await resp.json();if(obj.schema!=='central-europe-checklist-v1'||!Array.isArray(obj.items))throw Error('格式錯誤');const ids=new Set();CHECKS=obj.items.filter(x=>{if(!x||typeof x.id!=='string'||!/^[-a-z0-9_]+$/.test(x.id)||typeof x.title!=='string'||ids.has(x.id))return false;ids.add(x.id);return true}).map(x=>({id:x.id,title:x.title,detail:String(x.detail||''),checked:!!x.checked}));if(activePage==='tools')render()}catch(e){/* keep embedded fallback for file:// local previews */}}
function toolsPage(){const state=checkState();const tickets=filteredTickets();return `<div class="wrap content">${secTitle('TICKET CENTER','票券與預訂','依類別、狀態篩選；不含私人 QR Code 或訂單編號。')}<div class="filter-panel"><div class="filter-label">票券類別</div>${ticketFilterButtons('type',TICKET_TYPES)}<div class="filter-label" style="margin-top:16px">預訂狀態</div>${ticketFilterButtons('status',TICKET_STATUS)}</div><div class="ticket-count">顯示 <strong>${tickets.length}</strong> / ${DATA.tickets.length} 項</div><div class="tickets">${tickets.length?tickets.map(t=>`<div class="ticket-row"><div class="time">${escapeHTML(t.date)}</div><div class="title">${escapeHTML(t.name)}<div class="ticket-tags"><span class="ticket-kind">${escapeHTML(TICKET_TYPES.find(x=>x[0]===ticketType(t))?.[1]||'其他')}</span>${badge(t.status)}</div></div><div class="remark">${escapeHTML(t.note)}</div><div class="price">${t.price==='—'?'待確認':'NT$'+escapeHTML(t.price)}</div></div>`).join(''):'<div class="empty">目前沒有符合篩選條件的票券。</div>'}</div>${secTitle('PERSONAL CHECKLIST','出發前核對清單','勾選即自動儲存在目前的瀏覽器；可匯出／匯入 JSON 備份。',`<span id="check-count"></span>`)}<div class="check-tools"><span id="check-save-status" role="status" aria-live="polite">自動儲存到此裝置</span><div class="check-actions"><button class="btn secondary" onclick="exportChecklist()">↓ 匯出 JSON 備份</button><label class="btn secondary import-button" for="check-import-input">↑ 匯入 JSON<input id="check-import-input" type="file" accept=".json,application/json" onchange="importChecklist(this)" hidden></label></div></div><div class="task-wrap">${CHECKS.map(x=>`<label class="task-item ${state[x.id]?'done':''}" data-check="${escapeHTML(x.id)}"><input type="checkbox" ${state[x.id]?'checked':''} onchange="toggleCheck('${escapeHTML(x.id)}',this.checked)"><span><strong>${escapeHTML(x.title)}</strong><small>${escapeHTML(x.detail)}</small></span></label>`).join('')}</div><div class="check-explain">📁 <strong>GitHub 清單來源：</strong><a href="checklist.json" target="_blank" rel="noopener noreferrer">checklist.json</a>。這份檔案保存公開版的預設項目，不會隨訪客勾選自動更新；個人勾選狀態只儲存於目前瀏覽器。換手機時可用上方 JSON 備份匯入。</div><div style="margin-top:20px">${notice()}</div></div>`}

function creditsPage(){return `<div class="wrap content">${secTitle('CREDITS & NOTES','照片授權與資料說明','照片採 Wikimedia Commons 遠端縮圖，網頁使用 object-fit 做展示裁切，未修改原始作品檔案。每張都有對應景點和來源頁面；部分照片的授權細節請以檔案頁為準。')}<div class="credit-grid" style="background:#fff;border:1px solid var(--border);padding:22px;border-radius:15px">${Object.entries(PIC).map(([k,p])=>`<a href="${p.page}" target="_blank" rel="noopener noreferrer">↗ ${escapeHTML(p.caption)}<br>作者：${escapeHTML(p.author)} · ${escapeHTML(p.license)}</a>`).join('')}</div><div class="notice" style="margin-top:20px"><strong>資料注意：</strong>行程與時間來自旅行試算表截至 ${escapeHTML(DATA.version)}。照片使用 Wikimedia Commons 遠端素材，需網路才能載入；若離線，文字、票券狀態、行程與注意事項仍能開啟，但 Google Maps 導航與官方即時公告必須連網。各別票價、營業時間、月台與交通服務可能改變，請以現場及營運商官方資訊為準。原試算表並非與此下載的 HTML 版本即時同步，之後修改行程要重新產製網頁。</div></div>`}

function foot(){return `<footer class="foot"><div class="wrap"><div class="eyebrow">ONE TRIP · THREE COUNTRIES</div><h2>Elsewhere. <span style="font-size:14px;color:#93a9a5">Central Europe 2026</span></h2><p class="footer-small">2026/10/19–10/29 · 資料版本：${escapeHTML(DATA.version)} · 所有時間為當地時間</p><p class="footer-small">照片由 Wikimedia Commons 遠端提供 · <a href="#credits" onclick="event.preventDefault();go('credits')">圖片出處與授權</a>　</p></div></footer>`}
function selectNav(){for(const id of ['desktop-nav','mobile-nav'])document.getElementById(id).innerHTML=NAV.map(v=>id==='desktop-nav'?`<button class="${v[0]===activePage?'active':''}" onclick="go('${v[0]}')">${v[2]}</button>`:`<button class="${v[0]===activePage?'active':''}" onclick="go('${v[0]}')"><i>${v[1]}</i><span>${v[2]}</span></button>`).join('')}
function render(){document.body.classList.toggle('journal-mode',activePage==='home');document.querySelector('.brand-name').textContent=activePage==='home'?'The Travel Diary.':'Elsewhere.';document.querySelector('.brand-sub').textContent=activePage==='home'?'A CENTRAL EUROPE JOURNAL · 2026':'A CENTRAL EUROPE JOURNAL';selectNav();let page=activePage==='home'?home():activePage==='days'?daysPage():activePage==='transit'?transitPage():activePage==='hotels'?hotelsPage():activePage==='food'?foodsPage():activePage==='tools'?toolsPage():creditsPage();document.getElementById('app').innerHTML=page+foot();updateCheckCount();if(activePage==='days')renderDayRouteMap();document.title=(activePage==='days'?DAYS[activeDay].short+' '+DAYS[activeDay].headline+'｜':'')+'中歐行旅 · Central Europe 2026'}
function go(page,idx,skipHash){activePage=page||'home';if(typeof idx==='number'){const next=Math.max(0,Math.min(DAYS.length-1,idx));if(next!==activeDay)routeSegmentIndex=0;activeDay=next;}if(!skipHash){history.replaceState(null,'','#'+(activePage==='days'?`days/${activeDay}`:activePage))}render();window.scrollTo({top:0,behavior:'instant'})}
function boot(){const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('days/')){activePage='days';activeDay=Math.max(0,Math.min(10,Number(h.split('/')[1])||0))}else if(['home','transit','hotels','food','tools','credits','days'].includes(h))activePage=h;else activePage='home';render()}
window.addEventListener('hashchange',boot);boot();loadChecklistDefaults();
</script>
</body>
</html>
